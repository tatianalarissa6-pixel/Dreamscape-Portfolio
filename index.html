<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to My World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2240%22 r=%2224%22 fill=%22none%22 stroke=%22black%22 stroke-width=%227%22/%3E%3C/svg%3E">
<style>
  :root { --paper:#fdfdfb; --ink:#161616; --void:#0b0b10; --sans:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); font-family:var(--sans); color:var(--ink); }
  .scene { position:absolute; inset:0; }

  /* ---------- SCENE 1: sketch ---------- */
  #scene1 { transform-origin:0 0; will-change:transform; }
  #scene1 svg { width:100%; height:100%; display:block; }
  #scene1 text { font-family:var(--sans); }
  .btn { cursor:pointer; outline:none; }
  .btn .focus { opacity:0; }
  .btn:focus-visible .focus { opacity:1; }

  /* ---------- SCENE 2: the mind (rough placeholder) ---------- */
  #void { display:none; background:var(--void); overflow:hidden; perspective:1100px; }
  #void::before { content:""; position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #ffffff55, transparent),
      radial-gradient(1px 1px at 78% 14%, #ffffff44, transparent),
      radial-gradient(1.5px 1.5px at 64% 72%, #ffffff33, transparent),
      radial-gradient(1px 1px at 32% 84%, #ffffff44, transparent),
      radial-gradient(1px 1px at 90% 58%, #ffffff33, transparent),
      radial-gradient(1.5px 1.5px at 46% 40%, #ffffff22, transparent); }
  #space { position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; }
  .card { position:absolute; left:0; top:0; padding:14px; background:#fbfaf7; color:#222; border-radius:2px;
    box-shadow:0 18px 50px rgba(0,0,0,.55); display:flex; flex-direction:column; justify-content:space-between;
    font-size:18px; line-height:1.15; will-change:transform, opacity; }
  .card b { font-weight:700; }
  .tag { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#666; }
  .tag.light { color:#fff; text-shadow:0 1px 2px #0008; }
  .ph { flex:1; margin:10px 0; background:repeating-linear-gradient(45deg,#ebe7de 0 8px,#f4f1ea 8px 16px);
    display:grid; place-items:center; text-align:center; padding:10px; font-size:10px; color:#888; }
  .textile { background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 3px,transparent 3px 9px),
                         repeating-linear-gradient(90deg,#b5533c 0 7px,#d98b5f 7px 14px); }
  .textile.t2 { background:repeating-linear-gradient(0deg,rgba(255,255,255,.2) 0 2px,transparent 2px 8px),
                            repeating-linear-gradient(90deg,#2f4b7c 0 6px,#5b7db1 6px 12px); }
  .flag-ua { background:linear-gradient(#0057b7 50%, #ffd700 50%); padding:0; }
  .flag-br { background:#009c3b; padding:0; }
  .flag-br::before { content:""; position:absolute; inset:11% 7%; background:#ffdf00; clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .flag-br::after { content:""; position:absolute; left:50%; top:50%; width:31%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%;
    background:linear-gradient(168deg, transparent 46%, #fff 46% 55%, transparent 55%), #002776; }
  .saying .say { font-size:20px; font-style:italic; }
  .album { justify-content:flex-end; }
  .album::before { content:""; position:absolute; inset:20% 24% 32%; border-radius:50%; background:rgba(255,255,255,.22); }
  .history { background:#e8dcc4; }
  .history .big { font-size:48px; font-weight:700; color:#5a4630; }
  .featured { cursor:pointer; }
  .featured .ttl { font-size:22px; }
  .hanger { position:absolute; top:100%; left:58%; width:60px; height:98px; margin-top:-3px; overflow:visible;
    transform-origin:50% 0; animation:swing 2.2s ease-in-out infinite alternate; }
  @keyframes swing { from { transform:rotate(-10deg); } to { transform:rotate(10deg); } }
  .hanger.off { display:none; }
  .jumper { position:absolute; left:0; top:0; width:60px; height:98px; margin-left:-30px; display:none; transform-origin:50% 0; pointer-events:none; }
  .jumper svg { width:100%; height:100%; overflow:visible; }
  #hint { position:absolute; left:0; right:0; bottom:7%; text-align:center; color:#fff; font-size:12px; font-weight:700; letter-spacing:.3em; opacity:0; transition:opacity .6s; pointer-events:none; }
  #hint.show { opacity:.8; }

  /* ---------- placeholders ---------- */
  .end { display:none; place-items:center; text-align:center; padding:24px; }
  .end h1 { font-size:clamp(34px, 6vw, 64px); margin:.15em 0; font-weight:700; letter-spacing:-.01em; }
  .end p { font-size:17px; color:#555; max-width:36ch; margin:0 auto 1.4em; line-height:1.4; }
  .restart { font:inherit; font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; background:none; border:1.5px solid var(--ink); padding:10px 20px; cursor:pointer; color:var(--ink); }


  /* ================= WORLDS ================= */
  #world { display:none; background:#0b0b10; overflow:hidden; }
  #cam { position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
  #stage { position:absolute; }
  #stage img.bg { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  .vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.32)); }

  .hotspot { position:absolute; border:0; padding:0; background:transparent; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .6s; }
  .hotspot.on { opacity:1; pointer-events:auto; }
  .hotspot::before { content:""; position:absolute; inset:-6px; border:3px solid #fff6d8;
    box-shadow:0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.35), 0 0 26px 8px rgba(255,236,170,.75), inset 0 0 22px 4px rgba(255,236,170,.45);
    animation:pulse 1.8s ease-in-out infinite; }
  .hotspot.ellipse::before { border-radius:50%; }
  .hotspot:focus-visible { outline:3px dashed #2a6fdb; outline-offset:10px; }
  @keyframes pulse { 0%,100% { opacity:.5; transform:scale(1); } 50% { opacity:1; transform:scale(1.05); } }
  .hotspot .lbl { position:absolute; left:50%; top:calc(100% + 16px); transform:translateX(-50%); white-space:nowrap; font-size:12px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.62); padding:8px 12px; border-radius:2px; }

  .wtitle { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:#fff; pointer-events:none;
    opacity:0; transition:opacity .8s; text-shadow:0 2px 30px rgba(0,0,0,.55); padding:0 16px; z-index:6; }
  .wtitle.show { opacity:1; }
  .wtitle::before { content:""; position:absolute; left:50%; top:50%; width:min(1100px, 120vw); height:380px; transform:translate(-50%,-50%); z-index:-1;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.5), rgba(0,0,0,.25) 45%, transparent 70%); }
  .wtitle .k { font-size:12px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; }
  .wtitle h2 { font-size:clamp(44px, 8vw, 110px); margin:.12em 0 0; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .wtitle .sub { font-size:16px; margin-top:.6em; opacity:.92; }

  /* info panel */
  .panel { position:absolute; right:24px; top:50%; width:min(440px, calc(100vw - 32px)); max-height:min(82vh, 780px); display:flex; flex-direction:column;
    transform:translate(calc(100% + 60px), -50%); transition:transform .7s cubic-bezier(.2,.8,.2,1); z-index:5; }
  .panel.open { transform:translate(0, -50%); }
  .panel .inner { overflow:auto; padding:26px 26px 6px; }
  .panel .proj { font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; opacity:.65; padding-right:30px; }
  .panel h3 { font-size:28px; line-height:1.1; margin:.35em 0 .55em; letter-spacing:-.01em; }
  .panel p { font-size:15.5px; line-height:1.55; margin:0 0 14px; }
  .figs { display:grid; gap:10px; margin:4px 0 14px; }
  .figs.two { grid-template-columns:1fr 1fr; }
  .figs figure { margin:0; cursor:zoom-in; }
  .figs img { width:100%; display:block; aspect-ratio:4/3; object-fit:contain; background:#fff; }
  .figs img.photo { object-fit:cover; }
  .figs figcaption { font-size:11px; letter-spacing:.06em; margin-top:5px; opacity:.75; }
  .pnav { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 26px 20px; }
  .pnav button, .pill { font:inherit; font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; padding:11px 16px;
    cursor:pointer; background:none; border:1.5px solid var(--pfg); color:var(--pfg); }
  .pnav button.primary { background:var(--pfg); color:var(--pbg); }
  .pnav button:disabled { opacity:.3; cursor:default; }
  .pnav .count { font-size:12px; letter-spacing:.15em; opacity:.7; }
  .pmin { position:absolute; top:14px; right:14px; width:30px; height:30px; border:0; background:none; color:inherit; font-size:20px; line-height:1; cursor:pointer; z-index:2; }
  .pill { position:absolute; right:24px; bottom:24px; z-index:5; display:none; background:var(--pbg); }

  /* style: hyper-realism */
  .s-real { --pfg:#141414; --pbg:#ffffff; }
  .s-real .panel { color:#141414; background:rgba(255,255,255,.86); backdrop-filter:blur(14px) saturate(1.2); -webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:0 24px 70px rgba(0,0,0,.28); }

  /* style: watercolour */
  .s-water { --pfg:#2c4a74; --pbg:#fbf8f1; }
  .s-water .panel { color:#2c3440; font-family:Georgia, "Times New Roman", serif; }
  .s-water .panel::before { content:""; position:absolute; inset:-10px; z-index:-1; filter:url(#wcEdge);
    background:
      radial-gradient(circle at 14% 8%, rgba(130,180,225,.42), transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(240,196,80,.34), transparent 40%),
      radial-gradient(circle at 80% 12%, rgba(196,106,60,.16), transparent 30%),
      #fbf8f1;
    box-shadow:0 20px 50px rgba(30,50,80,.25); }
  .s-water .panel h3 { font-style:italic; font-weight:400; font-size:32px; }
  .s-water .figs img { background:#fbf8f1; mix-blend-mode:multiply; }
  .s-water .pnav button, .s-water .pill { font-family:var(--sans); border-radius:3px 8px 4px 9px; }
  .s-water .pill { background:#fbf8f1; }

  /* style: clay */
  .s-clay { --pfg:#7a3b1d; --pbg:#f6e6d6; }
  .s-clay .panel { color:#4a2a1a; background:#ecd5c0; border-radius:30px;
    font-family:ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", sans-serif;
    box-shadow:0 26px 60px rgba(40,15,5,.55), inset 0 4px 0 rgba(255,255,255,.5), inset 0 -10px 20px rgba(120,60,30,.25); }
  .s-clay .panel h3 { font-size:30px; }
  .s-clay .pnav button, .s-clay .pill { border:0; border-radius:999px; background:#dcb79a; color:#5a2c14;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 5px 10px rgba(80,35,15,.35); }
  .s-clay .pnav button.primary { background:#b8673d; color:#fff4ea; }
  .s-clay .figs img { border-radius:16px; }
  .s-clay .hotspot::before { border-color:#ffd7a8; box-shadow:0 0 24px 8px rgba(255,160,80,.6), inset 0 0 18px 4px rgba(255,170,90,.4); }

  /* the companion */
  .buddy { position:absolute; left:4vw; bottom:3vh; height:min(30vh, 250px); aspect-ratio:140/262; z-index:4; pointer-events:none; transform-origin:50% 100%; }
  .buddy svg { width:100%; height:100%; overflow:visible; }
  .buddy .ln { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .s-real .buddy .bod { filter:drop-shadow(0 6px 5px rgba(0,0,0,.35)); }
  .s-real .buddy .ln, .s-real .buddy .headc { stroke:#1b1b1b; stroke-width:6; }
  .s-real .buddy .headc { fill:rgba(250,250,248,.94); }
  .s-real .buddy .eye { fill:#111; }
  .s-real .buddy .shadow { fill:rgba(0,0,0,.3); filter:blur(4px); }
  .s-water .buddy .bod { filter:url(#wcStroke); }
  .s-water .buddy .ln, .s-water .buddy .headc { stroke:#2f5487; stroke-width:7; stroke-opacity:.85; }
  .s-water .buddy .headc { fill:rgba(150,190,230,.4); }
  .s-water .buddy .eye { fill:#2f5487; }
  .s-water .buddy .shadow { fill:rgba(60,90,140,.2); filter:blur(5px); }
  .s-clay .buddy .bod { filter:url(#clayF); }
  .s-clay .buddy .ln, .s-clay .buddy .headc { stroke:#b8673d; stroke-width:13; }
  .s-clay .buddy .headc { fill:#c97a4c; }
  .s-clay .buddy .mouth { stroke:#6e3418; stroke-width:6; }
  .s-clay .buddy .eye { fill:#3a1c0c; }
  .s-clay .buddy .shadow { fill:rgba(40,15,5,.45); filter:blur(5px); }

  /* lightbox */
  #lightbox { position:fixed; inset:0; background:rgba(10,10,10,.9); display:none; place-items:center; z-index:50; cursor:zoom-out; padding:24px; }
  #lightbox.open { display:grid; }
  #lightbox img { max-width:100%; max-height:84vh; box-shadow:0 20px 60px rgba(0,0,0,.6); background:#fff; display:block; margin:0 auto; }
  #lightbox p { color:#eee; text-align:center; font-size:13px; letter-spacing:.08em; margin:12px 0 0; }

  /* behind-the-design placeholder */
  #behind { background:#17130f; color:#efe6da; }
  #behind p { color:#bcae9c; }
  #behind .restart { color:#efe6da; border-color:#efe6da; }

  /* ================= EXPRESS (PDF click-through) ================= */
  #xview { display:none; background:#efede8; }
  .xbar { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; z-index:2;
    font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  .xbtn { font:inherit; background:none; border:1.5px solid #161616; padding:8px 14px; cursor:pointer; color:#161616; }
  .xstage { position:absolute; inset:60px 84px 60px; display:grid; place-items:center; }
  .xstage img { max-width:100%; max-height:100%; box-shadow:0 14px 40px rgba(0,0,0,.18); background:#fff; display:block; cursor:pointer; }
  .xarrow { position:absolute; top:50%; transform:translateY(-50%); width:54px; height:54px; border-radius:50%; border:1.5px solid #161616; background:#fff;
    font-size:22px; cursor:pointer; z-index:2; color:#161616; }
  .xarrow.prev { left:16px; } .xarrow.next { right:16px; }
  .xarrow:disabled { opacity:.25; cursor:default; }
  .xcount { position:absolute; bottom:22px; left:0; right:0; text-align:center; font-size:12px; letter-spacing:.2em; }

  @media (max-width: 680px) {
    .panel { right:16px; top:auto; bottom:16px; max-height:62vh; transform:translateY(calc(100% + 60px)); }
    .panel.open { transform:none; }
    .buddy { height:15vh; bottom:auto; top:2vh; }
    .xstage { inset:60px 8px 84px; }
    .xarrow { top:auto; bottom:12px; transform:none; }
    .xcount { bottom:30px; }
  }

  @media (prefers-reduced-motion: reduce) { .hanger { animation:none; } }
</style>
</head>
<body>

<!-- ================= SCENE 1 ================= -->
<div id="scene1" class="scene">
  <svg id="s1svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="A loose pen sketch of a pavilion with a stick figure next to it">
    <defs id="defs">
      <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- the guy gets a much gentler wobble so he stays readable -->
      <filter id="roughSoft" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence id="turb2" type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="1" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <clipPath id="doorClip"><rect x="740" y="560" width="120" height="200"/></clipPath>
    </defs>
    <rect x="-3000" y="-3000" width="7600" height="6900" fill="#fdfdfb"/>
    <g id="drawing" filter="url(#rough)"></g>   <!-- pen lines (gently "boil") -->
    <g id="ui"></g>                              <!-- crisp type + buttons -->
  </svg>
</div>

<!-- ================= SCENE 2: THE MIND ================= -->
<div id="void" class="scene">
  <div id="space"></div>
  <div id="hint">↑ CLICK IT</div>
</div>

<!-- ================= WORLDS 1–3 ================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="wcEdge" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="24" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wcStroke" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation=".9"/>
  </filter>
  <filter id="clayF" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
    <feSpecularLighting in="b" surfaceScale="5" specularConstant=".8" specularExponent="16" lighting-color="#fff1e2" result="s">
      <fePointLight x="-80" y="-320" z="140"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sp"/>
    <feComposite in="SourceGraphic" in2="sp" operator="arithmetic" k1="0" k2="1" k3=".55" k4="0" result="lit"/>
    <feDropShadow in="lit" dx="2" dy="6" stdDeviation="3" flood-color="#3b1a0a" flood-opacity=".45"/>
  </filter>
</svg>

<div id="world" class="scene">
  <div id="cam">
    <div id="stage">
      <img class="bg" id="wbg" alt="">
      <button class="hotspot" id="hotspot" type="button"><span class="lbl" id="hotlbl"></span></button>
    </div>
  </div>
  <div class="vignette"></div>
  <div class="wtitle" id="wtitle"><div class="k" id="wtk"></div><h2 id="wth"></h2><div class="sub" id="wts"></div></div>
  <div class="buddy" id="buddy"></div>
  <aside class="panel" id="panel" aria-live="polite">
    <button class="pmin" id="pmin" type="button" aria-label="Hide info">–</button>
    <div class="inner" id="pinner"></div>
    <div class="pnav">
      <button type="button" id="pprev">← Back</button>
      <span class="count" id="pcount"></span>
      <button type="button" class="primary" id="pnext">Next →</button>
    </div>
  </aside>
  <button class="pill" id="pill" type="button">Info</button>
</div>

<div id="lightbox" role="dialog" aria-modal="true"><div><img id="lbimg" alt=""><p id="lbcap"></p></div></div>

<div id="behind" class="scene end">
  <div>
    <p class="tag" style="color:#bcae9c">scene 6</p>
    <h1>Behind the Design</h1>
    <p>The gear warehouse goes here next.</p>
    <button class="restart" onclick="location.reload()">↺ Start over</button>
  </div>
</div>

<!-- ================= EXPRESS: the portfolio, page by page ================= -->
<div id="xview" class="scene" role="region" aria-label="Portfolio pages">
  <div class="xbar">
    <span>Larissa De Souza · Portfolio</span>
    <button class="xbtn" type="button" onclick="location.reload()">↺ Start over</button>
  </div>
  <div class="xstage"><img id="ximg" alt=""></div>
  <button class="xarrow prev" id="xprev" type="button" aria-label="Previous page">←</button>
  <button class="xarrow next" id="xnext" type="button" aria-label="Next page">→</button>
  <div class="xcount" id="xcount"></div>
</div>

<script>
/* ============================================================
   helpers
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
const INK = '#161616';
const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';
const R = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, str, a = {}) {
  const t = el('text', { x, y, fill: INK, 'font-family': SANS, ...a }, parent);
  t.textContent = str; return t;
}
function tween(dur, fn, ease = t => t) {
  return new Promise(res => {
    const t0 = performance.now();
    function f(now) {
      const p = Math.min(1, (now - t0) / dur);
      fn(ease(p), p);
      if (p < 1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}

/* ---------- architect's-pen helpers: loose, overshooting, multi-pass ---------- */
function segD(x1, y1, x2, y2, j) {
  // gestural cubic: two loose control points so strokes bow and drift
  const c1x = lerp(x1, x2, .33) + R(-j * 2.2, j * 2.2), c1y = lerp(y1, y2, .33) + R(-j * 2.2, j * 2.2);
  const c2x = lerp(x1, x2, .66) + R(-j * 2.2, j * 2.2), c2y = lerp(y1, y2, .66) + R(-j * 2.2, j * 2.2);

function sLine(p, x1, y1, x2, y2, o = {}) {

  const L = Math.hypot(x2 - x1, y2 - y1) || 1, ux = (x2 - x1) / L, uy = (y2 - y1) / L;

  for (let i = 0; i < passes; i++) {
    const a = R(-os * .3, os), b = R(-os * .3, os);   // overshoot (or stop short) at the corners
    const sx = x1 - ux * a, sy = y1 - uy * a, ex = x2 + ux * b, ey = y2 + uy * b;
    let d;

  for (let i = 0; i < n; i++) {

    d += ` Q${(x + R(-rx, rx) * .6).toFixed(1)} ${(y + R(-ry, ry) * .6).toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)}`;
    x = nx; y = ny;

}
function sPoly(p, pts, closed = true, o = {}) {
  const g = el('g', {}, p);

    const a = pts[i], b = pts[(i + 1) % pts.length];

  }

}
const sRect = (p, x, y, w, h, o) => sPoly(p, [[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true, o);

    }
  }
  return el('path', { d, fill: o.fill || 'none', stroke: o.stroke || INK, 'stroke-width': o.w || 1.7,
    'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p);
}
function hatch(p, x, y, w, h, o = {}) {      // diagonal shadow hatching
  const id = 'c' + Math.random().toString(36).slice(2);
  el('rect', { x, y, width: w, height: h }, el('clipPath', { id }, defs));
  const g = el('g', { 'clip-path': `url(#${id})` }, p), gap = o.gap || 7;

}
function palm(p, x, base, h, w) {           // scratchy zig-zag tree like the reference
  sLine(p, x, base, x + R(-8, 8), base - h * .62, { passes: 2, w: 1.5, over: 4 });
  const top = base - h, bot = base - h * .5;

    while (y < bot) {

      const ww = w * (.35 + .65 * Math.sin(Math.PI * (y - top) / (bot - top)));

let state = 'idle';

  turb.setAttribute('seed', s); turb2.setAttribute('seed', s);

let doorItemsOp = 1;
const T0 = performance.now();
function loop(now) {
  const t = (now - T0) / 1000;
  if (state === 'idle') G.bob = Math.sin(t * 2.2) * 2;
  placeGuy();
  for (const p of peeks) {
    const x = p.bx + Math.sin(t * .7 + p.ph) * 12, y = p.by + Math.cos(t * .5 + p.ph) * 10;
    p.r.setAttribute('x', x.toFixed(1)); p.r.setAttribute('y', y.toFixed(1));
    p.r.setAttribute('transform', `rotate(${(t * 20 + p.ph * 30).toFixed(1)} ${x + p.s / 2} ${y + p.s / 2})`);
  }
  doorItems.setAttribute('opacity', doorItemsOp);
  if (state !== 'void') requestAnimationFrame(loop);
}

/* eyes follow the cursor + blink */
addEventListener('pointermove', e => {
  if (state !== 'idle') return;
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  for (const E of eyes) {
    const dx = pt.x - E.ex, dy = pt.y - E.ey, L = Math.hypot(dx, dy) || 1;
    E.pupil.setAttribute('cx', E.ex + dx / L * 3.6); E.pupil.setAttribute('cy', E.ey + dy / L * 3.6);
  }

  while (state === 'idle') {
    await sleep(R(2200, 5200));
    eyes.forEach(E => { E.white.setAttribute('ry', 1); E.pupil.setAttribute('opacity', 0); });
    await sleep(120);
    eyes.forEach(E => { E.white.setAttribute('ry', 8); E.pupil.setAttribute('opacity', 1); });

/* idle: wave, then point at IMMERSION, repeat */
async function wave() {
  const a0 = G.armR;
  await tween(280, e => { if (state === 'idle') G.armR = lerp(a0, -78, e); }, easeOut);
  await tween(1200, (e, p) => { if (state === 'idle') G.armR = -78 + 22 * Math.sin(p * Math.PI * 6); });
}
async function point() {
  const a0 = G.armR;
  await tween(320, e => { if (state === 'idle') G.armR = lerp(a0, -44, e); }, easeOut);
  const L = arrow.getTotalLength();
  arrow.style.strokeDasharray = L;
  await Promise.all([
    tween(650, (e, p) => { if (state === 'idle') G.armLen = 70 + 14 * Math.abs(Math.sin(p * Math.PI * 2)); }),
    tween(550, e => { if (state === 'idle') { arrow.setAttribute('opacity', 1); arrow.style.strokeDashoffset = L * (1 - e); } }, easeOut),
    tween(700, (e, p) => { if (state === 'idle') btnImm.setAttribute('transform', `rotate(${(4 * Math.sin(p * Math.PI * 5) * (1 - p)).toFixed(2)} 1420 440)`); })
  ]);
  await sleep(1300);
  if (state !== 'idle') return;
  const a1 = G.armR;
  await tween(400, e => { if (state === 'idle') { G.armR = lerp(a1, 62, e); arrow.setAttribute('opacity', 1 - e); } });
}
(async function idleLoop() {
  await sleep(700);
  while (state === 'idle') {
    await wave(); if (state !== 'idle') break;
    await sleep(250);
    await point(); if (state !== 'idle') break;
    await sleep(2200);
  }
})();

  if (reacting) return; reacting = true;

  G.hx = 0; reacting = false;
}

  if (reacting || state !== 'idle') return; reacting = true;

  G.hy = 0; reacting = false;
}

  state = 'entering';
  arrow.setAttribute('opacity', 0);
  btnImm.setAttribute('transform', '');
  G.armLen = 70; G.bob = 0;
  const a0 = G.armR, l0 = G.armL;
  await tween(420, (e, p) => { G.hop = -Math.sin(p * Math.PI) * 36; G.armR = lerp(a0, -60, e); G.armL = lerp(l0, -120, e); }, easeOut);
  await tween(200, e => { G.armR = lerp(-60, 62, e); G.armL = lerp(-120, 118, e); });

  const x0 = G.x;
  await Promise.all([
    tween(900, e => drawDoor(e * 1.38), easeInOut),
    tween(1500, (e, p) => {
      G.x = lerp(x0, 800, e);
      const w = Math.sin(p * Math.PI * 8);
      G.leg = w; G.walkBob = -Math.abs(w) * 6;
      G.armR = 75 + w * 20; G.armL = 105 - w * 20;
    }, easeInOut)
  ]);
  G.leg = 0; G.walkBob = 0;
  await tween(600, e => { G.s = lerp(.75, .32, e); G.y = lerp(760, 712, e); guy.setAttribute('opacity', 1 - e); }, easeIn);
  await zoom();
  showVoid();
}

function zoom() {
  state = 'zoom';
  boiling = false;
  const scene = document.getElementById('scene1');
  const r = doorway.getBoundingClientRect();
  const C = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  const M = { x: innerWidth / 2, y: innerHeight / 2 };
  const S = Math.max(innerWidth / r.width, innerHeight / r.height) * 1.3;
  return tween(2000, (e, p) => {
    const s = Math.pow(S, e);
    const k = easeInOut(p);
    const Lx = C.x + (M.x - C.x) * k;
    const Ly = C.y + (M.y - C.y) * k + Math.sin(p * Math.PI * 6) * 7 * (1 - p);
    scene.style.transform = `translate(${Lx - s * C.x}px, ${Ly - s * C.y}px) scale(${s})`;
    doorItemsOp = 1 - clamp((p - .6) / .3);
  }, easeIn);
}

/* To use a real image on a card, add  img: 'images/your-file.jpg'  to its entry. */
function makeCard(d, extra = '') {
  const c = document.createElement('div');
  c.className = 'card ' + d.c + ' ' + extra;
  c.style.width = d.w + 'px'; c.style.height = d.h + 'px';
  c.style.marginLeft = -d.w / 2 + 'px'; c.style.marginTop = -d.h / 2 + 'px';

  if (d.album) c.style.background = `hsl(${(R(0, 360)) | 0} 50% 42%)`;

// where the hanging guy's hands sit on a card (card centre + offsets)
const anchor = c => ({ x: c.x + c.w * .08 + 30, y: c.y + c.h / 2 - 3, z: c.z });
function spawn() {
  let x = R(-1500, 1500), y = R(-900, 900);
  if (Math.abs(x) < 360 && Math.abs(y) < 280) x += (x < 0 ? -1 : 1) * 420;
  return { x, y, ry: R(-35, 35), rz: R(-25, 25), vr: R(-.006, .006) };
}

let voidRunning = false;
function showVoid() {
  state = 'void';
  document.getElementById('scene1').style.display = 'none';
  document.getElementById('void').style.display = 'block';
  voidRunning = true;

  const space = document.getElementById('space');
  const hint = document.getElementById('hint');
  const items = [];
  for (let i = 0; i < 26; i++) {
    const c = makeCard(CARD_DEFS[i % CARD_DEFS.length]);
    space.appendChild(c);
    items.push({ el: c, ...spawn(), z: R(-4200, -1400) });
  }
  const F = { el: makeCard({ c: 'project', w: 260, h: 330,
      html: '<span class="tag">project 01</span><div class="ph" style="background:url(assets/w1/living-room.jpg) center/cover"></div><b class="ttl">Ledger Residence</b>' + HANGER_OFF }, 'featured'),
    x: -460, y: -240, z: -2200, ry: 25, rz: -12, w: 260, h: 330, mode: 'drift' };
  space.appendChild(F.el);

  // the textile he's clinging to at first (background detail)
  const T = { el: makeCard({ c: 'textile', w: 190, h: 190, html: '<span class="tag light">textile</span>' + HANGER }),
    x: -110, y: -420, z: -1900, ry: 10, rz: -6, w: 190, h: 190, mode: 'drift', fade: 1 };
  space.appendChild(T.el);

  // a free-flying copy of him, used only for the leap between cards
  const J = { el: document.createElement('div'), x: 0, y: 0, z: 0, rot: 0, on: false };
  J.el.className = 'jumper';
  J.el.innerHTML = `<svg ${SVG_OPEN}>${GUY_INNER}</svg>`;
  space.appendChild(J.el);

  let last = performance.now(), t = 0;
  const tStart = last;
  function frame(now) {
    const dt = Math.min(50, now - last); last = now; t += dt / 1000;
    const burst = 1 + 6 * Math.max(0, 1 - (now - tStart) / 1600);
    for (const it of items) {
      it.z += dt * .12 * burst; it.rz += it.vr * dt;
      if (it.z > 700) Object.assign(it, spawn(), { z: -4200 });
      it.el.style.opacity = clamp((it.z + 4200) / 1400) * clamp((800 - it.z) / 400);
      it.el.style.transform = `translate3d(${it.x}px,${it.y}px,${it.z}px) rotateY(${it.ry}deg) rotateZ(${it.rz}deg)`;
    }
    if (F.mode === 'drift') F.z += dt * .05 * burst;
    const hold = F.mode === 'hold';
    F.el.style.opacity = F.mode === 'drift' ? clamp((F.z + 4200) / 1400) : 1;
    F.el.style.transform = `translate3d(${F.x}px,${F.y + (hold ? Math.sin(t * 1.6) * 8 : 0)}px,${F.z}px) rotateY(${F.ry}deg) rotateZ(${F.rz + (hold ? Math.sin(t * 1.1) * 1.5 : 0)}deg)`;

    if (T.mode === 'drift') T.z += dt * .05 * burst;
    T.el.style.opacity = clamp((T.z + 4200) / 1400) * T.fade;
    T.el.style.transform = `translate3d(${T.x}px,${T.y}px,${T.z}px) rotateY(${T.ry}deg) rotateZ(${T.rz}deg)`;

    if (J.on) J.el.style.transform = `translate3d(${J.x}px,${J.y}px,${J.z}px) rotate(${J.rot}deg)`;
    if (voidRunning) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  setTimeout(async () => {
    F.mode = 'approach';
    const s = { ...F };
    const approach = tween(3200, e => {
      F.x = lerp(s.x, 0, e); F.y = lerp(s.y, -30, e); F.z = lerp(s.z, 180, e);
      F.ry = lerp(s.ry, 0, e); F.rz = lerp(s.rz, 0, e);
    }, easeInOut);

    // mid-approach: he lets go of the textile and leaps onto Project 01
    await sleep(900);
    T.el.querySelector('.hanger').classList.add('off');
    J.on = true; J.el.style.display = 'block';
    await tween(1300, (e, p) => {
      const a = anchor(T), b = anchor(F);
      J.x = lerp(a.x, b.x, e);
      J.y = lerp(a.y, b.y, e) - Math.sin(p * Math.PI) * 220;   // arc through the air
      J.z = lerp(a.z, b.z, e);
      J.rot = Math.sin(p * Math.PI * 3) * 25;                   // flailing
    }, easeInOut);
    J.on = false; J.el.style.display = 'none';
    F.el.querySelector('.hanger').classList.remove('off');

    // the abandoned textile drifts away into the dark
    T.mode = 'flee';
    const ts = { ...T };
    tween(2600, e => {
      T.x = lerp(ts.x, ts.x - 900, e); T.y = lerp(ts.y, ts.y - 500, e);
      T.z = lerp(ts.z, ts.z - 1600, e); T.rz = lerp(ts.rz, ts.rz - 120, e); T.fade = 1 - e;
    }, easeIn);

    await approach;
    F.mode = 'hold';
    hint.classList.add('show');
    F.el.addEventListener('click', () => enterProject(F, hint), { once: true });
  }, 2600);
}

async function enterProject(F, hint) {
  F.mode = 'enter';
  hint.classList.remove('show');
  const s = { ...F };
  await tween(1200, e => { F.z = lerp(s.z, 1040, e); F.x = lerp(s.x, 0, e); F.y = lerp(s.y, 0, e); }, easeIn);
  voidRunning = false;
  document.getElementById('void').style.display = 'none';
  showWorld(0);
}

const $ = id => document.getElementById(id);
const worldEl = $('world'), cam = $('cam'), stage = $('stage'), wbg = $('wbg');
const hotspot = $('hotspot'), panel = $('panel'), pill = $('pill');
const W = { i: -1, step: 0, phase: 'off', cfg: null };

/* companion (same guy, restyled per world by CSS) */
$('buddy').innerHTML = `<svg viewBox="-70 -250 140 262" aria-hidden="true">
  <ellipse class="shadow" cx="0" cy="4" rx="42" ry="7"/>
  <g class="bod">
    <g class="bhead"><circle class="headc" cx="0" cy="-200" r="38"/>
      <circle class="eye" cx="-13" cy="-210" r="5"/><circle class="eye" cx="13" cy="-210" r="5"/>
      <path class="ln mouth" d="M-15 -184 L15 -184"/></g>
    <path class="ln" d="M0 -162 L0 -70"/>
    <path class="ln barmL"/><path class="ln barmR"/><path class="ln blegL"/><path class="ln blegR"/>
  </g></svg>`;
const buddy = $('buddy'), bsvg = buddy.querySelector('svg');
const BP = { armL: buddy.querySelector('.barmL'), armR: buddy.querySelector('.barmR'), legL: buddy.querySelector('.blegL'),
  legR: buddy.querySelector('.blegR'), head: buddy.querySelector('.bhead'), bod: buddy.querySelector('.bod') };
const BS = { bob: 0, hop: 0, armR: 62, armL: 118, len: 70, leg: 0 };
function buddyRender() {
  const arm = (p, deg, len) => { const a = deg * Math.PI / 180; p.setAttribute('d', `M0 -135 L${(Math.cos(a) * len).toFixed(1)} ${(-135 + Math.sin(a) * len).toFixed(1)}`); };
  arm(BP.armR, BS.armR, BS.len); arm(BP.armL, BS.armL, 70);
  BP.legL.setAttribute('d', `M0 -70 L${(-25 + BS.leg * 18).toFixed(1)} ${(-Math.max(0, BS.leg) * 8).toFixed(1)}`);
  BP.legR.setAttribute('d', `M0 -70 L${(25 - BS.leg * 18).toFixed(1)} ${(-Math.max(0, -BS.leg) * 8).toFixed(1)}`);
  BP.bod.setAttribute('transform', `translate(0 ${(BS.bob + BS.hop).toFixed(1)})`);
}
let buddyLoopOn = false;
function buddyLoop(now) {
  if (W.phase === 'info' || W.phase === 'explore' || W.phase === 'intro') BS.bob = Math.sin(now / 1000 * 2.2) * 2.5;
  buddyRender();
  if (buddyLoopOn) requestAnimationFrame(buddyLoop);
}
async function buddyHop() {
  await tween(420, (e, p) => { BS.hop = -Math.sin(p * Math.PI) * 34; BS.armR = lerp(62, -60, Math.sin(p * Math.PI)); BS.armL = lerp(118, -120, Math.sin(p * Math.PI)); });
  BS.hop = 0; BS.armR = 62; BS.armL = 118;
}
// angle (in the guy's own drawing space) from his shoulder to the hotspot
function angleToHotspot() {
  const m = bsvg.getScreenCTM(); if (!m) return -45;
  const sh = new DOMPoint(0, -135).matrixTransform(m);
  const r = hotspot.getBoundingClientRect();
  return Math.atan2(r.top + r.height / 2 - sh.y, r.left + r.width / 2 - sh.x) * 180 / Math.PI;
}
async function buddyPointLoop() {
  while (W.phase === 'explore') {
    const a0 = BS.armR, target = angleToHotspot();
    await tween(320, e => { if (W.phase === 'explore') BS.armR = lerp(a0, target, e); }, easeOut);
    await tween(700, (e, p) => { if (W.phase === 'explore') BS.len = 70 + 14 * Math.abs(Math.sin(p * Math.PI * 2)); });
    await sleep(2200);
    if (W.phase !== 'explore') break;
    const a1 = BS.armR;
    await tween(380, e => { if (W.phase === 'explore') BS.armR = lerp(a1, 62, e); });
    await sleep(900);
  }
  BS.len = 70;
}

/* background sizing: cover the screen, but keep the focus point (and hotspot) in view */
function layoutStage() {
  const c = W.cfg; if (!c) return;
  const vw = innerWidth, vh = innerHeight;
  let w = Math.max(vw, vh * c.ar), h = w / c.ar;
  if (h < vh) { h = vh; w = h * c.ar; }
  const left = clamp(vw / 2 - c.focus[0] * w, vw - w, 0), top = clamp(vh / 2 - c.focus[1] * h, vh - h, 0);
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: left + 'px', top: top + 'px' });
}
addEventListener('resize', layoutStage);

/* info panel */
function renderStep() {
  const c = W.cfg, s = c.steps[W.step], n = c.steps.length;
  const figs = s.figs.map(([src, cap, kind]) =>
    `<figure data-src="${src}" data-cap="${cap}"><img src="${src}" alt="${cap}" class="${kind || ''}" loading="lazy"><figcaption>${cap}</figcaption></figure>`).join('');
  $('pinner').innerHTML = `<div class="proj">${c.title}</div><h3>${s.t}</h3>`
    + (s.figs.length ? `<div class="figs ${s.figs.length > 1 ? 'two' : ''}">${figs}</div>` : '')
    + (s.body ? `<p>${s.body}</p>` : '');
  $('pinner').scrollTop = 0;
  $('pcount').textContent = `${W.step + 1} / ${n}`;
  $('pprev').disabled = W.step === 0;
  $('pnext').textContent = W.step === n - 1 ? 'Explore →' : 'Next →';
}
function openPanel() { panel.classList.add('open'); pill.style.display = 'none'; }
function closePanel(showPill = true) { panel.classList.remove('open'); pill.style.display = showPill ? 'block' : 'none'; }
$('pnext').onclick = () => {
  if (W.step < W.cfg.steps.length - 1) { W.step++; renderStep(); }
  else finishInfo();
};
$('pprev').onclick = () => { if (W.step > 0) { W.step--; renderStep(); } };
$('pmin').onclick = () => closePanel(true);
pill.onclick = () => openPanel();
$('pinner').addEventListener('click', e => {
  const f = e.target.closest('figure'); if (!f) return;

$('lightbox').onclick = () => $('lightbox').classList.remove('open');
addEventListener('keydown', e => {
  if (e.key === 'Escape') $('lightbox').classList.remove('open');
  if (W.phase === 'info' && panel.classList.contains('open') && !$('lightbox').classList.contains('open')) {
    if (e.key === 'ArrowRight') $('pnext').click();
    if (e.key === 'ArrowLeft') $('pprev').click();
  }
});

function finishInfo() {
  closePanel(true);
  W.phase = 'explore';
  hotspot.classList.add('on');
  buddyPointLoop();
}

/* entering a world: arrive (camera settling), title card, then the info */
async function showWorld(i) {
  const c = WORLDS[i];
  W.i = i; W.cfg = c; W.step = 0; W.phase = 'intro';
  worldEl.className = 'scene s-' + c.style;
  worldEl.style.display = 'block';
  wbg.src = c.bg; wbg.alt = c.title;
  try { await wbg.decode(); } catch (e) {}
  layoutStage();
  const h = c.hotspot;
  Object.assign(hotspot.style, { left: h.x * 100 + '%', top: h.y * 100 + '%', width: h.w * 100 + '%', height: h.h * 100 + '%' });
  hotspot.classList.toggle('ellipse', h.shape === 'ellipse');
  hotspot.classList.remove('on');
  hotspot.setAttribute('aria-label', h.label);
  $('hotlbl').textContent = h.label;
  closePanel(false);
  buddy.style.transform = ''; buddy.style.opacity = 1;
  BS.armR = 62; BS.armL = 118; BS.len = 70; BS.leg = 0;
  if (!buddyLoopOn) { buddyLoopOn = true; requestAnimationFrame(buddyLoop); }

  // camera arrives: starts pushed-in and soft, settles into the room
  cam.style.filter = '';
  await tween(1400, e => {
    const s = lerp(1.4, 1, e);
    cam.style.transform = `translate(${(1 - s) * innerWidth / 2}px, ${(1 - s) * innerHeight / 2}px) scale(${s})`;
    cam.style.filter = `blur(${lerp(12, 0, e).toFixed(2)}px)`;
  }, easeOut);
  cam.style.filter = ''; cam.style.transform = '';

  $('wtk').textContent = c.kicker; $('wth').textContent = c.title; $('wts').textContent = c.sub;
  $('wtitle').classList.add('show');
  buddyHop();
  await sleep(2000);
  $('wtitle').classList.remove('show');
  await sleep(500);
  renderStep();
  openPanel();
  W.phase = 'info';
}

/* leaving a world: the guy walks in, the camera pushes through the hotspot */
hotspot.addEventListener('click', async () => {
  if (W.phase !== 'explore') return;
  W.phase = 'leaving';
  hotspot.classList.remove('on');
  closePanel(false);
  const r = hotspot.getBoundingClientRect();
  const C = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  const M = { x: innerWidth / 2, y: innerHeight / 2 };
  const S = Math.max(innerWidth / r.width, innerHeight / r.height) * 1.2;
  const br = buddy.getBoundingClientRect();
  const B0 = { x: br.left + br.width / 2, y: br.bottom };
  await Promise.all([
    tween(1100, (e, p) => {              // he walks toward it, shrinking into the distance
      const w = Math.sin(p * Math.PI * 7);
      BS.leg = w; BS.armR = 75 + w * 20; BS.armL = 105 - w * 20;
      buddy.style.transform = `translate(${(C.x - B0.x) * e}px, ${(r.bottom - B0.y) * e}px) scale(${lerp(1, .25, e)})`;
      buddy.style.opacity = 1 - clamp((p - .6) / .4);
    }, easeIn),
    (async () => {
      await sleep(500);
      await tween(1700, (e, p) => {
        const s = Math.pow(S, e), k = easeInOut(p);
        const Lx = C.x + (M.x - C.x) * k, Ly = C.y + (M.y - C.y) * k + Math.sin(p * Math.PI * 5) * 6 * (1 - p);
        cam.style.transform = `translate(${Lx - s * C.x}px, ${Ly - s * C.y}px) scale(${s})`;
        cam.style.filter = `blur(${(clamp((p - .55) / .45) * 14).toFixed(2)}px)`;
      }, easeIn);
    })()
  ]);
  BS.leg = 0;
  if (W.i < WORLDS.length - 1) showWorld(W.i + 1);
  else {
    W.phase = 'off'; buddyLoopOn = false;
    worldEl.style.display = 'none';
    $('behind').style.display = 'grid';
  }
});

/* ============================================================
   EXPRESS — the whole portfolio PDF, one page per click
   ============================================================ */
const XN = 18;
let xi = 0;
const xsrc = n => `assets/express/page-${String(n + 1).padStart(2, '0')}.jpg`;
function xshow() {
  $('ximg').src = xsrc(xi);
  $('ximg').alt = `Portfolio page ${xi + 1} of ${XN}`;
  $('xcount').textContent = `${xi + 1} / ${XN}`;
  $('xprev').disabled = xi === 0;
  $('xnext').disabled = xi === XN - 1;
  if (xi + 1 < XN) new Image().src = xsrc(xi + 1);   // preload the next page
}
function openExpress() {
  document.getElementById('scene1').style.display = 'none';
  $('xview').style.display = 'block';
  xi = 0; xshow();
}
$('xprev').onclick = () => { if (xi > 0) { xi--; xshow(); } };
$('xnext').onclick = () => { if (xi < XN - 1) { xi++; xshow(); } };
$('ximg').onclick = e => {                       // click right half = next, left half = back
  const r = e.currentTarget.getBoundingClientRect();
  (e.clientX - r.left > r.width / 2 ? $('xnext') : $('xprev')).click();
};
addEventListener('keydown', e => {
  if ($('xview').style.display !== 'block') return;
  if (e.key === 'ArrowRight') $('xnext').click();
  if (e.key === 'ArrowLeft') $('xprev').click();
});
</script>
